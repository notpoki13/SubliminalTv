<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>July 4th Incident</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    font-family:"Courier New", monospace;
}

/* FULL SCREEN TV */
.tv{
    position:absolute;
    inset:0;
    background:#050505;
}

/* SCREEN */
.screen{
    position:absolute;
    inset:0;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    text-align:center;
    text-shadow:0 0 10px white;
}

/* VHS STATIC */
.vhs-static{
    position:absolute;
    inset:-80px;

    background:
    repeating-radial-gradient(
        circle at center,
        #ffffff 0px,
        #000000 1px,
        #ffffff 2px,
        #000000 3px
    );

    opacity:0.18;

    animation:
    noise 0.07s infinite linear,
    flicker 0.12s infinite;
}

/* STRONG MULTI SCANLINES (YOUR REQUEST) */
.scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
    repeating-linear-gradient(
        transparent 0px,
        transparent 1px,
        rgba(0,0,0,0.65) 2px,
        rgba(0,0,0,0.65) 3px,
        transparent 4px
    ),
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.02) 0px,
        rgba(0,0,0,0.02) 2px,
        rgba(255,255,255,0.01) 4px
    );

    animation: scanMove 0.15s infinite linear;
    mix-blend-mode: overlay;
}

/* MOVING TRACKING LINE */
.tracking{
    position:absolute;
    width:100%;
    height:12px;

    background:
    linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,0.5),
        transparent
    );

    animation:tracking 6s linear infinite;
}

/* TEXT */
.title{
    position:relative;
    z-index:5;
    letter-spacing:4px;
    font-size:22px;
    margin-bottom:20px;
}

#countdown{
    position:relative;
    z-index:5;
    font-size:46px;
    line-height:1.5;
}

/* ANIMATIONS */
@keyframes noise{
    0%{transform:translate(0,0);}
    25%{transform:translate(-3px,2px);}
    50%{transform:translate(2px,-2px);}
    75%{transform:translate(-2px,-3px);}
    100%{transform:translate(0,0);}
}

@keyframes flicker{
    0%{opacity:0.12;}
    50%{opacity:0.22;}
    100%{opacity:0.15;}
}

@keyframes scanMove{
    0%{transform:translateY(0px);}
    50%{transform:translateY(1px);}
    100%{transform:translateY(0px);}
}

@keyframes tracking{
    from{top:-20px;}
    to{top:100%;}
}

.glitch{
    animation:glitch 0.15s infinite;
}

@keyframes glitch{
    0%{transform:translateX(0);}
    25%{transform:translateX(-1px);}
    50%{transform:translateX(1px);}
    75%{transform:translateX(-1px);}
    100%{transform:translateX(0);}
}

</style>
</head>

<body>

<div class="tv">

    <div class="screen">

        <div class="vhs-static"></div>
        <div class="scanlines"></div>
        <div class="tracking"></div>

        <div class="title glitch">
            JULY 4TH INCIDENT STARTS IN
        </div>

        <div id="countdown" class="glitch">
            LOADING...
        </div>

    </div>

</div>

<script>

/* YOUR ROBLOX GAME HERE */
const ROBLOX_GAME_URL =
"https://www.roblox.com/games/120870537763162/Subliminal";

/* TARGET DATE */
const targetDate =
new Date("July 4, 2026 00:00:00").getTime();

const countdown =
document.getElementById("countdown");

let redirected = false;

function updateCountdown(){

    const now = Date.now();
    const distance = targetDate - now;

    if(distance <= 0 && !redirected){

        redirected = true;

        document.querySelector(".screen").innerHTML = `
            <div class="vhs-static"></div>
            <div class="scanlines"></div>

            <div style="
                position:relative;
                z-index:5;
                font-size:48px;
                color:white;
                text-shadow:0 0 20px white;
            ">
                SIGNAL FOUND
                <br><br>
                CONNECTING...
            </div>
        `;

        setTimeout(()=>{
            window.location.href = ROBLOX_GAME_URL;
        },3000);

        return;
    }

    const days =
    Math.floor(distance/(1000*60*60*24));

    const hours =
    Math.floor((distance%(1000*60*60*24))/(1000*60*60));

    const minutes =
    Math.floor((distance%(1000*60*60))/(1000*60));

    const seconds =
    Math.floor((distance%(1000*60))/1000);

    countdown.innerHTML =
        days + " DAYS<br>" +
        hours + " HOURS<br>" +
        minutes + " MINUTES<br>" +
        seconds + " SECONDS";
}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
