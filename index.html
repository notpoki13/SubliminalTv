<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>July 4th Incident</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    font-family:"Courier New", monospace;
}

/* =========================
   WARNING SCREEN
========================= */
#warning{
    position:absolute;
    inset:0;
    background:#000;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:100;
    padding:20px;
}

#warning h1{
    font-size:28px;
    margin-bottom:15px;
    letter-spacing:3px;
}

#warning p{
    max-width:600px;
    font-size:14px;
    opacity:0.8;
    line-height:1.6;
    margin-bottom:20px;
}

#warning button{
    padding:12px 20px;
    background:#fff;
    color:#000;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:bold;
}

/* FULL SCREEN TV */
.tv{
    position:absolute;
    inset:0;
    background:#050505;
}

/* SCREEN */
.screen{
    position:absolute;
    inset:0;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    text-align:center;
    text-shadow:0 0 10px white;
}

/* VHS STATIC (slightly reduced flicker for safety) */
.vhs-static{
    position:absolute;
    inset:-60px;

    background:
    repeating-radial-gradient(
        circle at center,
        #ffffff 0px,
        #000000 1px,
        #ffffff 2px,
        #000000 3px
    );

    opacity:0.14;

    animation:
    noise 0.12s infinite linear,
    flicker 0.6s infinite;
}

/* SCANLINES (slower + softer) */
.scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
    repeating-linear-gradient(
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.5) 3px,
        rgba(0,0,0,0.5) 4px
    );

    animation: scanMove 0.3s infinite linear;
    mix-blend-mode: overlay;
}

/* TRACKING LINE */
.tracking{
    position:absolute;
    width:100%;
    height:10px;

    background:
    linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,0.4),
        transparent
    );

    animation:tracking 7s linear infinite;
}

/* TEXT */
.title{
    position:relative;
    z-index:5;
    letter-spacing:4px;
    font-size:20px;
    margin-bottom:20px;
}

#countdown{
    position:relative;
    z-index:5;
    font-size:44px;
    line-height:1.5;
}

/* ANIMATIONS */
@keyframes noise{
    0%{transform:translate(0,0);}
    25%{transform:translate(-2px,1px);}
    50%{transform:translate(1px,-1px);}
    75%{transform:translate(-1px,-2px);}
    100%{transform:translate(0,0);}
}

@keyframes flicker{
    0%{opacity:0.10;}
    50%{opacity:0.18;}
    100%{opacity:0.12;}
}

@keyframes scanMove{
    0%{transform:translateY(0px);}
    100%{transform:translateY(1px);}
}

@keyframes tracking{
    from{top:-20px;}
    to{top:100%;}
}

.glitch{
    animation:glitch 0.2s infinite;
}

@keyframes glitch{
    0%{transform:translateX(0);}
    25%{transform:translateX(-1px);}
    50%{transform:translateX(1px);}
    75%{transform:translateX(-1px);}
    100%{transform:translateX(0);}
}

</style>
</head>

<body>

<!-- WARNING SCREEN -->
<div id="warning">
    <h1>⚠ WARNING</h1>
    <p>
        This experience contains flashing lights, static effects, and visual distortions
        that may affect individuals with photosensitive epilepsy or similar conditions.
    </p>
    <button onclick="startExperience()">ENTER</button>
</div>

<!-- TV -->
<div class="tv">

    <div class="screen">

        <div class="vhs-static"></div>
        <div class="scanlines"></div>
        <div class="tracking"></div>

        <div class="title glitch">
            JULY 4TH INCIDENT STARTS IN
        </div>

        <div id="countdown" class="glitch">
            LOADING...
        </div>

    </div>

</div>

<script>

/* SHOW EXPERIENCE */
function startExperience(){
    document.getElementById("warning").style.display = "none";
}

/* ROBLOX GAME URL */
const ROBLOX_GAME_URL =
"https://www.roblox.com/games/120870537763162/Subliminal";

/* TARGET DATE */
const targetDate =
new Date("July 4, 2026 00:00:00").getTime();

const countdown =
document.getElementById("countdown");

let redirected = false;

function updateCountdown(){

    const now = Date.now();
    const distance = targetDate - now;

    if(distance <= 0 && !redirected){

        redirected = true;

        document.querySelector(".screen").innerHTML = `
            <div class="vhs-static"></div>
            <div class="scanlines"></div>

            <div style="
                position:relative;
                z-index:5;
                font-size:48px;
                color:white;
                text-shadow:0 0 20px white;
            ">
                SIGNAL FOUND
                <br><br>
                CONNECTING...
            </div>
        `;

        setTimeout(()=>{
            window.location.href = ROBLOX_GAME_URL;
        },3000);

        return;
    }

    const days =
    Math.floor(distance/(1000*60*60*24));

    const hours =
    Math.floor((distance%(1000*60*60*24))/(1000*60*60));

    const minutes =
    Math.floor((distance%(1000*60*60))/(1000*60));

    const seconds =
    Math.floor((distance%(1000*60))/1000);

    countdown.innerHTML =
        days + " DAYS<br>" +
        hours + " HOURS<br>" +
        minutes + " MINUTES<br>" +
        seconds + " SECONDS";
}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
